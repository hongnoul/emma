# Fly.io config for the Emmatics API.
# Deploy: fly launch --copy-config --no-deploy && fly deploy
# The image bakes the published graph generation; redeploy to publish a new one.
# NOTE: app slug stays rare-disease-atlas-api so existing deploys keep working.
app = "rare-disease-atlas-api"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[env]
  ATLAS_GRAPH_PATH = "/data/graph.bulk.json"
